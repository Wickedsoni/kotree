name: build

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Kobweb CLI 0.9.23
        run: |
          curl -fsSL -o kobweb.zip https://github.com/varabyte/kobweb-cli/releases/download/v0.9.23/kobweb-0.9.23.zip
          unzip -q kobweb.zip -d "$HOME/kobweb-cli"
          echo "$HOME/kobweb-cli/kobweb-0.9.23/bin" >> "$GITHUB_PATH"
      - run: chmod +x gradlew
      - name: Validators and buildSrc tests
        run: ./gradlew :site:validateContent
      - name: Gate script (export, file and log check, kotree.js size)
        run: bash scripts/wave-check.sh
      - name: Upload static export
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site-export
          path: site/.kobweb/site
          retention-days: 3
      - name: Upload export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: site/export.log
          if-no-files-found: ignore

  # Publishes the verified export to the site-dist branch. Vercel (linked to this repo,
  # production branch site-dist, no build step) serves that branch as the live site.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: publish-site
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: site-export
          path: dist
      - name: Push export to site-dist
        run: |
          cp src/deploy/vercel.json dist/vercel.json
          cd dist
          git init -q -b site-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: export of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site-dist
      - name: Trigger Vercel production deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          # Vercel's Git integration does not deploy site-dist pushes; the hook does.
          test -n "$VERCEL_DEPLOY_HOOK" || { echo "VERCEL_DEPLOY_HOOK secret is not set"; exit 1; }
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
